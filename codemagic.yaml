workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
    scripts:
      - name: Set up code signing
        script: |
          echo $CERTIFICATE_P12 | base64 --decode > /tmp/certificate.p12
          echo $PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CERTIFICATE_PASSWORD
          xcode-project use-profiles --profile /tmp/profile.mobileprovision
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build IPA Dev
        script: |
          flutter build ipa \
            --release \
            -t lib/main.dart \
            --export-options-plist=ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
