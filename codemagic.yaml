workflows:
  ios-release:
    name: 🚀 iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
      vars:
        BUNDLE_ID: "com.ontik.onestate"

      ios_signing:
        certificates:
          - onestate
        provisioning_profiles:
          - onestate

    scripts:
      - name: 📦 Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: 🧩 Build iOS Release IPA
        script: |
          echo "🚀 Building IPA (Release)..."
          flutter build ipa --release --export-method app-store
          echo "✅ IPA build finished."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
