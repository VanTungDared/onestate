workflows:
  ios-release:
    name: 🚀 iOS Release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate # nhóm secret chứa các biến bên dưới
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"
        ENTRY_POINT: "lib/main.dart"

      ios_signing:
        certificates:
          - onestate # certificate đã cấu hình trên Appcircle
        provisioning_profiles:
          - profile_onestate # provisioning profile đã cấu hình trên Appcircle

    scripts:
      # ----------------------------
      # 📦 1. Get Dependencies
      # ----------------------------
      - name: 📦 Get Dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------
      # 🧩 2. Generate Export Options
      # ----------------------------
      - name: 🧩 Generate Export Options
        script: |
          echo "🧾 Creating export options plist..."
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>profile_onestate</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ Export options plist created."

      # ----------------------------
      # 🏗️ 3. Build IPA
      # ----------------------------
      - name: 🏗️ Build IPA
        script: |
          echo "🚀 Building release IPA for App Store..."
          flutter build ipa \
            --release \
            -t $ENTRY_POINT \
            --export-options-plist=/Users/builder/export_options.plist
          echo "✅ IPA build finished."

      # ----------------------------
      # 📂 4. Verify Output
      # ----------------------------
      - name: 🧾 Verify Output
        script: |
          echo "📁 Checking build output..."
          ls -lh build/ios/ipa || echo "⚠️ IPA folder missing!"
          ls -lh build/ios/archive || echo "⚠️ Archive folder missing!"

    # ----------------------------
    # 📦 Artifact Export
    # ----------------------------
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    # ----------------------------
    # 🚀 Publish to TestFlight
    # ----------------------------
    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
