workflows:
  ios-release:
    name: 🚀 iOS Release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"
        ENTRY_POINT: "lib/main.dart"

      ios_signing:
        certificates:
          - onestate # phải là Distribution certificate
        provisioning_profiles:
          - profile_onestate # phải là App Store / Distribution profile

    scripts:
      # ----------------------------
      # 📦 1. Get Dependencies
      # ----------------------------
      - name: 📦 Get Dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------
      # 🧩 2. Generate Export Options
      # ----------------------------
      - name: 🧩 Generate Export Options
        script: |
          echo "🧾 Creating export options plist..."
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>profile_onestate</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ Export options plist created."

      # ----------------------------
      # 🏗️ 3. Build IPA with verbose
      # ----------------------------
      - name: 🏗️ Build IPA (Verbose)
        script: |
          echo "🚀 Building release IPA for App Store (verbose)..."
          set -e   # exit ngay nếu build fail
          flutter build ipa \
            --release \
            -t $ENTRY_POINT \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-name=1.0.0 \
            --build-number=1 \
            -v 2>&1 | tee build/flutter_build.log
          echo "✅ IPA build finished."

    # ----------------------------
    # 📦 Artifact Export
    # ----------------------------
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/flutter_build.log

    # ----------------------------
    # 🚀 Publish to TestFlight
    # ----------------------------
    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true

    # ----------------------------
    # ⚙️ Codemagic specific iOS build options
    # ----------------------------
    ios:
      build:
        xcode_scheme: Runner
        configuration: Release
