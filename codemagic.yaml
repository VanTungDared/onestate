workflows:
  ios-release:
    name: 🚀 iOS Release (App Store)
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate # nhóm secret chứa các biến bên dưới
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"
        ENTRY_POINT: "lib/main.dart"

      # Không dùng ios_signing ở đây vì bạn đã tự decode base64
      # (tránh conflict khi Codemagic tự chèn)
      # ios_signing:
      #   certificates:
      #     - onestate
      #   provisioning_profiles:
      #     - profile_onestate

    scripts:
      # ----------------------------
      # 🔐 1. Setup Code Signing
      # ----------------------------
      - name: 🔐 Setup Code Signing
        script: |
          echo "🔑 Importing certificate & provisioning profile..."
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          # Import certificate (.p12)
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CERTIFICATE_PASSWORD"

          # 🩵 Copy provisioning profile vào đúng thư mục mà Xcode nhận diện
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "📲 Installed provisioning profile to ~/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Gán team ID & profile cho dự án Xcode
          xcode-project use-profiles --profile /tmp/profile.mobileprovision --team-id "$TEAM_ID"

          echo ""
          echo "=============================================="
          echo "🔍 VERIFYING CERTIFICATE (.p12)"
          echo "=============================================="
          openssl pkcs12 -in /tmp/certificate.p12 -info -noout -password pass:$CERTIFICATE_PASSWORD | grep "subject=" || true
          openssl pkcs12 -in /tmp/certificate.p12 -info -noout -password pass:$CERTIFICATE_PASSWORD | grep "issuer=" || true

          echo ""
          echo "=============================================="
          echo "🔍 VERIFYING PROVISIONING PROFILE (.mobileprovision)"
          echo "=============================================="
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist

          echo "🆔 App Identifier:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist || true

          echo "👥 Team Identifier:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" /tmp/profile.plist || true

          echo "📱 Profile Name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist || true

          echo "📅 Expiration Date:"
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" /tmp/profile.plist || true

          echo "🔐 Certificates included:"
          /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:0" /tmp/profile.plist | openssl x509 -noout -subject -issuer || true

          echo "✅ Code signing setup completed."

      # ----------------------------
      # 🧾 2. Export Options
      # ----------------------------
      - name: 🧩 Generate Export Options
        script: |
          echo "🧾 Creating export options plist..."
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>onestate</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ Export options plist created."

      # ----------------------------
      # 📦 3. Get Dependencies
      # ----------------------------
      - name: 📦 Get Dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------
      # 🏗️ 4. Build IPA
      # ----------------------------
      - name: 🏗️ Build IPA
        script: |
          echo "🚀 Building release IPA for App Store..."
          flutter build ipa \
            --release \
            -t $ENTRY_POINT \
            --export-options-plist=/Users/builder/export_options.plist
          echo "✅ IPA build finished."

      # ----------------------------
      # 📂 5. Verify Output
      # ----------------------------
      - name: 🧾 Verify Output
        script: |
          echo "📁 Checking build output..."
          ls -lh build/ios/ipa || echo "⚠️ IPA folder missing!"
          ls -lh build/ios/archive || echo "⚠️ Archive folder missing!"

    # ----------------------------
    # 📦 Artifact Export
    # ----------------------------
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    # ----------------------------
    # 🚀 Publish to TestFlight
    # ----------------------------
    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
