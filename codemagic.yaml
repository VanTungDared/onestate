workflows:
  ios-release:
    name: iOS Release (App Store)
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"
        ENTRY_POINT: "lib/main.dart"
      ios_signing:
        certificates:
          - onestate
        provisioning_profiles:
          - onestate

    scripts:
      - name: 📦 Clean & Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: 🏗️ Build IPA (Manual Signing)
        script: |
          echo "🚀 Building IPA for App Store using Codemagic Xcode helper..."
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-path build/ios/archive/Runner.xcarchive \
            --export-method app-store

      - name: 🧾 Verify Output
        script: |
          echo "📁 Checking output..."
          ls -lh build/ios/ipa || echo "⚠️ IPA folder missing!"
          ls -lh build/ios/archive || echo "⚠️ Archive missing!"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
