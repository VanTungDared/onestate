workflows:
  ios-release:
    name: iOS Release (Fix Team ID)
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM" # 🔹 Thay bằng team ID chính xác của bạn
        ENTRY_POINT: "lib/main.dart"
        EXPORT_METHOD: "app-store"

    scripts:
      - name: 🔐 Decode & Import Certificates
        script: |
          echo "🔽 Decode certificate & provisioning profile..."
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          echo "🔑 Importing certificate into keychain..."
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CERTIFICATE_PASSWORD"

          echo "📄 Applying provisioning profile..."
          xcode-project use-profiles --profile /tmp/profile.mobileprovision

          echo "✅ Code signing setup complete."

      - name: 📦 Get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: 🏗️ Build IPA (Force Team ID)
        script: |
          echo "🚀 Building release IPA for App Store..."
          flutter build ipa \
            --release \
            -t $ENTRY_POINT \
            --export-method $EXPORT_METHOD \
            --export-options-plist=/Users/builder/export_options.plist

      - name: 🧾 Fix Export Options
        script: |
          echo "🧩 Regenerating export options plist with correct Team ID..."
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>onestate</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          echo "✅ Export options created successfully"

      - name: 🧾 Verify Build Output
        script: |
          echo "📁 Checking build output..."
          ls -lh build/ios/ipa || echo "⚠️ IPA file not found!"
          ls -lh build/ios/archive || echo "⚠️ Archive folder missing!"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
