workflows:
  ios-release:
    name: 🚀 iOS Release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate # nhóm secret chứa các biến bên dưới
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"
        ENTRY_POINT: "lib/main.dart"

    scripts:
      # ----------------------------
      # 🔐 1. Setup Code Signing (đã fix hoàn toàn)
      # ----------------------------
      - name: 🔐 Setup Code Signing
        script: |
          echo "🔑 Importing certificate & provisioning profile..."
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          echo "🔧 Creating and unlocking temporary keychain..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "✅ Installed provisioning profile $PROFILE_UUID.mobileprovision"

          echo "🔍 Verifying..."
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist
          echo "✅ Code signing setup done."

      # ----------------------------
      # 🧾 2. Export Options
      # ----------------------------
      - name: 🧩 Generate Export Options
        script: |
          echo "🧾 Creating export options plist..."
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ontik.onestate</key>
              <string>onestate</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ Export options plist created."

      # ----------------------------
      # 📦 3. Get Dependencies
      # ----------------------------
      - name: 📦 Get Dependencies
        script: |
          flutter clean
          flutter pub get

      # ----------------------------
      # 🏗️ 4. Build IPA
      # ----------------------------
      - name: 🏗️ Build IPA
        script: |
          echo "🚀 Building release IPA for App Store..."
          flutter build ipa \
            --release \
            -t $ENTRY_POINT \
            --export-options-plist=/Users/builder/export_options.plist
          echo "✅ IPA build finished."

      # ----------------------------
      # 📂 5. Verify Output
      # ----------------------------
      - name: 🧾 Verify Output
        script: |
          echo "📁 Checking build output..."
          ls -lh build/ios/ipa || echo "⚠️ IPA folder missing!"
          ls -lh build/ios/archive || echo "⚠️ Archive folder missing!"

    # ----------------------------
    # 📦 Artifact Export
    # ----------------------------
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    # ----------------------------
    # 🚀 Publish to TestFlight
    # ----------------------------
    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
