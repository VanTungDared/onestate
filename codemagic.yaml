workflows:
  ios-adhoc:
    name: iOS AdHoc Build
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      groups:
        - onestate
      vars:
        BUNDLE_ID: "com.ontik.onestate"
        TEAM_ID: "QM93WQYMPM"

      ios_signing:
        certificates:
          - onestate
        provisioning_profiles:
          - onestate

    scripts:
      - name: Setup signing
        script: |
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          echo "$PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password "$CERTIFICATE_PASSWORD"
          xcode-project use-profiles --profile /tmp/profile.mobileprovision --team-id "$TEAM_ID"

      - name: Build IPA (ad-hoc)
        script: |
          flutter clean
          flutter pub get
          flutter build ipa --release --export-method ad-hoc

    artifacts:
      - build/ios/ipa/*.ipa
